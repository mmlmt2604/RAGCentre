[project]
name = "ragcentre-mcp"
version = "0.1.0.dev0"
description = "A read-only MCP server that lets agents search a RAGCentre knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# No dependency on `ragcentre`: this talks to its HTTP API, so agent hosts don't install the server.
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "anyio>=4.9",
    "pydantic>=2.12",
    "starlette>=0.48",
    "uvicorn>=0.34",
]

[project.scripts]
ragcentre-mcp = "ragcentre_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragcentre_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ragcentre_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["contract: runs against a real RAGCentre server (needs the ragcentre package)"]
