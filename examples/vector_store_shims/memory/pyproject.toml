[project]
name = "memory-shim"
version = "0.1.0"
description = "Reference ragcentre.vector_store/v1 service over an in-memory brute-force index."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
local = ["ragcentre"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_shim"]

[tool.uv.sources]
ragcentre = { path = "../../../", editable = true }

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
