[project]
name = "mineru-shim"
version = "0.1.0"
description = "Example ragcentre.parser/v1 service that parses documents with MinerU."
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "mineru>=4.2",
    "python-multipart>=0.0.20",
    "shimkit",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mineru_shim"]

[tool.uv.sources]
shimkit = { path = "../shimkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]
