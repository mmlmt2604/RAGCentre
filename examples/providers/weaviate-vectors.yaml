# Install the weaviate extra. These ports match tests/docker-compose.yml.
# Cloud: use an HTTPS URL and grpc_port: 443.
name: weaviate-main
kind: vector_store
type: weaviate
config:
  url: http://localhost:58080
  grpc_port: 50051
  prefix: ragcentre_
# Remove this block for an anonymous development server.
secrets:
  api_key: {env: RAGCENTRE_PROVIDER_WEAVIATE_API_KEY}
