# The example Docling parser service in examples/docling_shim (ragcentre.parser/v1).
# Start the service first: RAGCentre reads its /info when the provider is created.
name: docling
kind: parser
type: http
config:
  # With `docker compose --profile docling up`, RAGCentre reaches it as http://docling:8701 instead.
  base_url: http://127.0.0.1:8701
  timeout_seconds: 600
  max_concurrency: 2
