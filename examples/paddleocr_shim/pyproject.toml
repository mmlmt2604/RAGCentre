[project]
name = "paddleocr-shim"
version = "0.1.0"
description = "Example ragcentre.parser/v1 service that parses documents with PaddleOCR (PP-StructureV3)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "shimkit",
    "uvicorn>=0.34",
]
# PaddlePaddle is not a dependency: install the CPU or GPU wheel that suits your machine. See the README.

[project.optional-dependencies]
# PaddleOCR itself. Leave it out to use only a running PaddleX serving instance (PADDLEX_SERVING_URL).
local = ["paddleocr[doc-parser]>=3.7"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paddleocr_shim"]

[tool.uv.sources]
shimkit = { path = "../shimkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]
