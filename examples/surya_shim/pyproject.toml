[project]
name = "surya-shim"
version = "0.1.0"
description = "Example ragcentre.parser/v1 service that parses documents with the Surya OCR 2.5 model."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "shimkit",
    "surya-ocr>=0.24",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surya_shim"]

[tool.uv.sources]
shimkit = { path = "../shimkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]
