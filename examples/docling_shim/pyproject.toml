[project]
name = "docling-shim"
version = "0.3.1"
description = "Example ragcentre.parser/v1 service that parses documents with Docling."
requires-python = ">=3.11"
dependencies = [
    "docling-core>=2.40",
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "shimkit",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# Docling itself (PyTorch and its models). Leave it out to use only a remote docling-serve.
# `rapidocr` adds onnxruntime. Without it Docling falls back to RapidOCR on PyTorch, whose weights
# are not in the wheel and would be downloaded into site-packages on the first scan.
local = ["docling[rapidocr]>=2.40"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docling_shim"]

[tool.uv.sources]
shimkit = { path = "../shimkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]
