[project]
name = "docling-shim"
version = "0.1.0"
description = "Example ragcentre.parser/v1 service that parses documents with Docling."
requires-python = ">=3.11"
dependencies = [
    "docling>=2.40",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docling_shim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]
