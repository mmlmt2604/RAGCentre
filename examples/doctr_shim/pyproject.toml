[project]
name = "doctr-shim"
version = "0.1.0"
description = "Example ragcentre.parser/v1 service that reads PDFs and images with Mindee's docTR."
requires-python = ">=3.11"
dependencies = [
    "python-doctr>=1.0",
    "fastapi>=0.115",
    "numpy>=1.26",
    "pillow>=10.1",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.20",
    "shimkit",
    "uvicorn>=0.34",
]
# docTR pulls in PyTorch. For a CPU-only machine install the CPU wheels first (see the README),
# or uv/pip fetches the default build (with CUDA libraries on Linux).

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doctr_shim"]

[tool.uv.sources]
shimkit = { path = "../shimkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]
