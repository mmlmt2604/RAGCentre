name: release

# Push a tag like v0.0.1 to build the wheel (with the web UI inside) and publish a GitHub release.
# Uploading to PyPI is a separate, opt-in job: see the comment on `pypi`.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject version v$version"; exit 1; }
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ragcentre/__init__.py)
          test "$init" = "$version" || { echo "__version__ $init != $version"; exit 1; }
      - name: Build the web UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build the wheel and sdist
        run: uv build
      - name: The wheel contains the UI
        run: |
          python3 - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.startswith("ragcentre/ui_dist/") and n.endswith("index.html") for n in names), "ui_dist missing from wheel"
          PY
      - name: Smoke test the wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/ragcentre --help
          /tmp/smoke/bin/python -c "import ragcentre; print(ragcentre.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # PyPI publishing is off until you configure a trusted publisher for this repository on pypi.org
  # (project "ragcentre", workflow "release.yml", environment "pypi"), then remove `if: false`.
  pypi:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
