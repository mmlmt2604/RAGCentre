name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        # chroma is tested in the stores job: its onnxruntime dependency has no Python 3.15 wheel.
        run: uv sync --frozen --extra qdrant --extra pgvector
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -m "not integration"

  stores:
    # The optional vector stores on Python 3.13 (every extra installs there), with pgvector
    # against a real PostgreSQL service.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      RAGCENTRE_TEST_PGVECTOR_DSN: postgresql://ragcentre:ragcentre@127.0.0.1:54329/ragcentre
      RAGCENTRE_TEST_MONGODB_URI: mongodb://127.0.0.1:57017/?directConnection=true
      RAGCENTRE_TEST_PINECONE_URL: http://localhost:55080
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ragcentre
          POSTGRES_PASSWORD: ragcentre
          POSTGRES_DB: ragcentre
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U ragcentre -d ragcentre"
          --health-interval 2s --health-timeout 2s --health-retries 30
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 58000:8000
      redis:
        image: redis:8
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 59200:9200
      opensearch:
        image: opensearchproject/opensearch:3.10.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 59201:9200
      mongodb:
        image: mongodb/mongodb-atlas-local:9.0.8
        ports:
          - 57017:27017
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 5s --health-timeout 10s --health-start-period 20s --health-retries 30
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: none
          ENABLE_MODULES: ""
          CLUSTER_HOSTNAME: node1
        ports:
          - 58080:8080
          - 50051:50051
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Types
        run: uv run mypy
      - name: Wait for Chroma
        run: curl -sf --retry 30 --retry-connrefused --retry-delay 2 http://localhost:58000/api/v2/heartbeat
      - name: Wait for Weaviate
        run: curl -sf --retry 30 --retry-connrefused --retry-delay 2 http://localhost:58080/v1/.well-known/ready
      - name: Start Milvus and Pinecone Local
        run: docker compose -f tests/docker-compose.yml up -d --wait milvus pinecone
      - name: Wait for Pinecone Local
        run: |
          curl -sf --retry 30 --retry-connrefused --retry-delay 2 -H 'Api-Key: local-key' -H 'X-Pinecone-Api-Version: 2025-01' "$RAGCENTRE_TEST_PINECONE_URL/indexes"
      - name: Wait for Elasticsearch and OpenSearch
        run: |
          curl -sf --retry 60 --retry-connrefused --retry-delay 2 "http://localhost:59200/_cluster/health?wait_for_status=yellow&timeout=1s"
          curl -sf --retry 60 --retry-connrefused --retry-delay 2 "http://localhost:59201/_cluster/health?wait_for_status=yellow&timeout=1s"
      - name: Store tests
        run: uv run pytest tests/test_m2_sqlite_vec.py tests/test_m9_qdrant.py tests/test_m9_chroma.py tests/test_m9_chroma_server.py tests/test_vs_lancedb.py tests/test_vs_redis.py tests/test_vs_weaviate.py tests/test_vs_elasticsearch.py tests/test_vs_opensearch.py tests/test_vs_milvus.py tests/test_vs_pinecone.py tests/test_vs_mongodb.py tests/test_m9_pgvector.py tests/test_m9_optional_extras.py tests/test_no_ml_imports.py
      - name: Service logs
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs --tail 100 milvus pinecone
      - name: Stop services
        if: always()
        run: docker compose -f tests/docker-compose.yml down

  docling-shim:
    # The example parser service's tests. They need docling-core (the document model), not
    # Docling's models, and run outside the ragcentre environment because the two pin
    # incompatible typer versions.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    defaults:
      run:
        working-directory: examples/docling_shim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --isolated --no-project --with ../shimkit --with docling-core --with fastapi --with python-multipart --with httpx --with pytest pytest

  ragcentre-mcp:
    # The MCP server package. It has its own environment (it doesn't depend on ragcentre) and its tests
    # run against a fake API, over in-process, stdio and Streamable HTTP connections.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: packages/ragcentre-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  parser-shims:
    # The tests of shimkit and of the MinerU, PaddleOCR, Surya, EasyOCR and docTR example parser
    # services. They need none of the engines or their models (the conversion works on plain dicts),
    # and run outside the ragcentre environment because each engine pins its own dependencies. The
    # EasyOCR and docTR shims (and shimkit's page rendering) render real pages, so they also get
    # Pillow, pypdfium2 and numpy.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dir: shimkit, shimkit: ".", extra: "--with pillow --with pypdfium2"}
          - {dir: mineru_shim, shimkit: ../shimkit}
          - {dir: paddleocr_shim, shimkit: ../shimkit}
          - {dir: surya_shim, shimkit: ../shimkit}
          - {dir: easyocr_shim, shimkit: ../shimkit, extra: "--with pillow --with pypdfium2 --with numpy"}
          - {dir: doctr_shim, shimkit: ../shimkit, extra: "--with pillow --with pypdfium2 --with numpy"}
    defaults:
      run:
        working-directory: examples/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --isolated --no-project --with ${{ matrix.shimkit }} --with fastapi --with python-multipart --with httpx --with pytest ${{ matrix.extra }} pytest

  ui:
    # The web UI: lint, types, unit tests, the API contract check, the production build, and the
    # Playwright tests against a real `ragcentre serve` serving that build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci && uv sync --frozen
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: API contract (generated types are current and match src/api/types.ts)
        run: npm run check:contract
      - name: Build
        run: npm run build
      - name: End-to-end against the real server
        run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
