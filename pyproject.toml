[project]
name = "ragcentre"
version = "0.0.1"
description = "A small self-hosted retrieval service for building, comparing and evaluating RAG pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlite-vec==0.1.9",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragcentre = "ragcentre.cli:app"

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.20.0",
]
pgvector = [
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
]
chroma = [
    "chromadb>=1.5.9",
]

[project.entry-points."ragcentre.provider_types"]
parser_builtin_text = "ragcentre.providers.parsers.builtin_text:SPEC"
parser_http = "ragcentre.providers.parsers.http:SPEC"
chunker_http = "ragcentre.providers.chunkers.http:SPEC"
embedder_builtin_hash = "ragcentre.providers.embedders.builtin_hash:SPEC"
embedder_openai_compatible = "ragcentre.providers.embedders.openai_compatible:SPEC"
reranker_http = "ragcentre.providers.rerankers.http:SPEC"

[project.entry-points."ragcentre.chunk_strategies"]
fixed = "ragcentre.chunking.fixed:FixedStrategy"
recursive = "ragcentre.chunking.recursive:RecursiveStrategy"
structure = "ragcentre.chunking.structure:StructureStrategy"
page = "ragcentre.chunking.page:PageStrategy"
http = "ragcentre.chunking.http:HttpStrategy"

[project.entry-points."ragcentre.vector_stores"]
sqlite_vec = "ragcentre.stores.sqlite_vec:STORE_TYPE"
qdrant = "ragcentre.stores.qdrant:STORE_TYPE"
pgvector = "ragcentre.stores.pgvector:STORE_TYPE"
chroma = "ragcentre.stores.chroma:STORE_TYPE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcentre"]
# The built UI is git-ignored (it is generated by `npm run build` in ui/), so name it explicitly.
artifacts = ["src/ragcentre/ui_dist/**"]

# `uv build` makes the wheel from the sdist, so the sdist needs the built UI as well.
[tool.hatch.build.targets.sdist]
artifacts = ["src/ragcentre/ui_dist/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md", "ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ragcentre"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs external services (Docker)"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # chromadb reads back a collection created with embedding_function=None as a "legacy" config.
    "ignore:legacy embedding function config:DeprecationWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]
