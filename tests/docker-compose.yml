# PostgreSQL with pgvector for the integration tests (tests/test_m9_pgvector.py):
#
#   docker compose -f tests/docker-compose.yml up -d
#   uv run pytest -m integration
#   docker compose -f tests/docker-compose.yml down
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ragcentre
      POSTGRES_PASSWORD: ragcentre
      POSTGRES_DB: ragcentre
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragcentre -d ragcentre"]
      interval: 2s
      timeout: 2s
      retries: 30

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:58000:8000"
    healthcheck:
      # the image has no curl; bash's /dev/tcp is enough to hit the heartbeat
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.2
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    ports:
      - "127.0.0.1:58080:8080"
      - "127.0.0.1:50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:59200:9200"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9200 && printf \"GET /_cluster/health?wait_for_status=yellow&timeout=1s HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:3.10.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:59201:9200"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9200 && printf \"GET /_cluster/health?wait_for_status=yellow&timeout=1s HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  milvus:
    image: milvusdb/milvus:v3.0.6
    # Standalone with the embedded etcd and local storage: one container, no MinIO.
    entrypoint:
      - bash
      - -c
      - |
        printf 'listen-client-urls: http://0.0.0.0:2379\nadvertise-client-urls: http://0.0.0.0:2379\nquota-backend-bytes: 4294967296\nauto-compaction-mode: revision\nauto-compaction-retention: "1000"\n' > /milvus/configs/embedEtcd.yaml
        exec milvus run standalone
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE  # without it the embedded etcd refuses to start (exit 134)
    ports:
      - "127.0.0.1:59530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Pinecone Local (emulator, optional). Each index listens on its own port counted up from PORT and the
  # client is told localhost:<port>, so host ports must equal container ports. No healthcheck: the image has
  # no shell, wget or curl; wait from outside with `curl -sf http://localhost:55080/indexes`.
  # Run the tests with RAGCENTRE_TEST_PINECONE_URL=http://localhost:55080.
  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    environment:
      PORT: "55080"
      PINECONE_HOST: localhost
    ports:
      - "127.0.0.1:55080-55100:55080-55100"
