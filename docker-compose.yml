# docker compose up --build   ->   http://localhost:8700
#
# The example parser services are opt-in profiles, started next to RAGCentre:
#   docker compose --profile docling up --build
# (also: mineru, paddleocr, surya, easyocr, doctr; several --profile flags may be given). Inside this network a
# parser is reached by its service name, so register it with `base_url: http://docling:8701`
# (see examples/providers/). Each one downloads its models on the first parse, into its volume.
services:
  ragcentre:
    build:
      context: .
      args:
        # Optional vector-store clients; comma-separated, e.g. chroma or chroma,qdrant.
        RAGCENTRE_EXTRAS: ${RAGCENTRE_EXTRAS:-}
    ports:
      # Bound to localhost for first-run browser setup. Before widening, create an account
      # or set RAGCENTRE_API_TOKEN, and set RAGCENTRE_ALLOW_REMOTE_SETUP=0.
      - "127.0.0.1:8700:8700"
    volumes:
      - ragcentre-data:/data
    extra_hosts:
      # Lets RAGCentre find and call a parser that runs on this machine outside Compose (Linux needs this line).
      - "host.docker.internal:host-gateway"
    environment:
      # Optional: a full-scope operator credential for the CLI/MCP. Leave unset to create an
      # account in the browser on first run.
      RAGCENTRE_API_TOKEN: ${RAGCENTRE_API_TOKEN:-}
      # Browser setup is enabled by default because the published port is localhost-only.
      # Set to 0 to require `ragcentre account init`; disable this before widening the port.
      RAGCENTRE_ALLOW_REMOTE_SETUP: ${RAGCENTRE_ALLOW_REMOTE_SETUP:-1}
      # Where to look for parser shims: auto, off, or URLs (auto,http://gpu-box:8701 keeps both).
      RAGCENTRE_DISCOVERY_URLS: ${RAGCENTRE_DISCOVERY_URLS:-auto}
      # How often a working OCR engine is re-tested while the UI is open, in seconds (0: never).
      RAGCENTRE_OCR_RECHECK_SECONDS: ${RAGCENTRE_OCR_RECHECK_SECONDS:-600}
      # Fernet key for storing provider secrets in the database (optional).
      RAGCENTRE_SECRET_KEY: ${RAGCENTRE_SECRET_KEY:-}
      RAGCENTRE_SECRET_ENV_PREFIXES: ${RAGCENTRE_SECRET_ENV_PREFIXES-RAGCENTRE_PROVIDER_}
      RAGCENTRE_EGRESS_ALLOW: ${RAGCENTRE_EGRESS_ALLOW:-}
      # The parser services' keys (optional), so a provider's `api_key` secret can name them:
      #   ragcentre provider set-secret docling api_key --env RAGCENTRE_PROVIDER_DOCLING_SHIM_API_KEY
      RAGCENTRE_PROVIDER_DOCLING_SHIM_API_KEY: ${DOCLING_SHIM_API_KEY:-}
      RAGCENTRE_PROVIDER_MINERU_SHIM_API_KEY: ${MINERU_SHIM_API_KEY:-}
      RAGCENTRE_PROVIDER_PADDLEOCR_SHIM_API_KEY: ${PADDLEOCR_SHIM_API_KEY:-}
      RAGCENTRE_PROVIDER_SURYA_SHIM_API_KEY: ${SURYA_SHIM_API_KEY:-}
      RAGCENTRE_PROVIDER_EASYOCR_SHIM_API_KEY: ${EASYOCR_SHIM_API_KEY:-}
      RAGCENTRE_PROVIDER_DOCTR_SHIM_API_KEY: ${DOCTR_SHIM_API_KEY:-}
    restart: unless-stopped

  docling:
    profiles: [docling]
    build:
      context: examples
      dockerfile: docling_shim/Dockerfile
    ports:
      - "127.0.0.1:8701:8701"
    volumes:
      - docling-models:/home/shim/.cache
    environment:
      DOCLING_SHIM_API_KEY: ${DOCLING_SHIM_API_KEY:-}
      # Use a docling-serve you already run instead of Docling in this container (see
      # examples/docling_shim/README.md; build with `--build-arg ENGINE=remote` for a slim image).
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-}
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:-}
    restart: unless-stopped

  mineru:
    profiles: [mineru]
    build:
      context: examples
      dockerfile: mineru_shim/Dockerfile
    ports:
      - "127.0.0.1:8702:8702"
    volumes:
      - mineru-models:/home/shim/.cache
    environment:
      MINERU_SHIM_API_KEY: ${MINERU_SHIM_API_KEY:-}
      # Send parsing to a MinerU API server instead of running the models here.
      MINERU_API_URL: ${MINERU_API_URL:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
    restart: unless-stopped

  paddleocr:
    profiles: [paddleocr]
    build:
      context: examples
      dockerfile: paddleocr_shim/Dockerfile
    ports:
      - "127.0.0.1:8703:8703"
    volumes:
      - paddleocr-models:/home/shim/.paddlex
    environment:
      PADDLEOCR_SHIM_API_KEY: ${PADDLEOCR_SHIM_API_KEY:-}
      PADDLEOCR_SHIM_LANG: ${PADDLEOCR_SHIM_LANG:-}
      # Use a running `paddlex --serve` instead of PaddleOCR in this container.
      PADDLEX_SERVING_URL: ${PADDLEX_SERVING_URL:-}
      PADDLEX_SERVING_API_KEY: ${PADDLEX_SERVING_API_KEY:-}
    restart: unless-stopped

  surya:
    profiles: [surya]
    build:
      context: examples
      dockerfile: surya_shim/Dockerfile
    ports:
      - "127.0.0.1:8704:8704"
    volumes:
      - surya-models:/home/shim/.cache
    environment:
      SURYA_SHIM_API_KEY: ${SURYA_SHIM_API_KEY:-}
      # Attach to an inference server you already run (llama-server or vLLM) instead of starting one.
      SURYA_INFERENCE_BACKEND: ${SURYA_INFERENCE_BACKEND:-}
      SURYA_INFERENCE_URL: ${SURYA_INFERENCE_URL:-}
      SURYA_INFERENCE_API_KEY: ${SURYA_INFERENCE_API_KEY:-}
    restart: unless-stopped

  easyocr:
    profiles: [easyocr]
    build:
      context: examples
      dockerfile: easyocr_shim/Dockerfile
    ports:
      - "127.0.0.1:8705:8705"
    volumes:
      - easyocr-models:/home/shim/.EasyOCR
    environment:
      EASYOCR_SHIM_API_KEY: ${EASYOCR_SHIM_API_KEY:-}
      # Default languages, comma-separated EasyOCR codes (a route can choose its own).
      EASYOCR_SHIM_LANGS: ${EASYOCR_SHIM_LANGS:-}
    restart: unless-stopped

  doctr:
    profiles: [doctr]
    build:
      context: examples
      dockerfile: doctr_shim/Dockerfile
    ports:
      - "127.0.0.1:8706:8706"
    volumes:
      - doctr-models:/home/shim/.cache
    environment:
      DOCTR_SHIM_API_KEY: ${DOCTR_SHIM_API_KEY:-}
      # Where the models run: auto (empty), cpu, cuda or cuda:1. A container cannot use mps.
      DOCTR_SHIM_DEVICE: ${DOCTR_SHIM_DEVICE:-}
    restart: unless-stopped

volumes:
  ragcentre-data:
  docling-models:
  mineru-models:
  paddleocr-models:
  surya-models:
  easyocr-models:
  doctr-models:
